name: Bug report
description: Report a problem with AE2 Crafting Time
title: "[Bug]: "
labels:
  - bug
body:
  - type: input
    id: mod-version
    attributes:
      label: AE2 Crafting Time version
      description: Use the latest release before reporting the problem.
      placeholder: "Example: 1.0.8"
    validations:
      required: true

  - type: dropdown
    id: environment
    attributes:
      label: Minecraft version and mod loader
      options:
        - Minecraft 1.20.1 - Forge
        - Minecraft 1.20.1 - Fabric
        - Minecraft 1.21.1 - NeoForge
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Explain what happened and what you expected instead.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: How can we reproduce it?
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs or crash report
      description: Drag in the relevant log or crash report, or paste a link to it.
