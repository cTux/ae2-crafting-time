name: Bug report
description: Something went wrong? Tell me what happened.
title: "[Bug]: "
labels:
  - bug
body:
  - type: input
    id: mod-version
    attributes:
      label: AE2 Crafting Time version
      description: Please check that the problem still happens on the latest release.
      placeholder: "Example: 1.0.8"
    validations:
      required: true

  - type: dropdown
    id: environment
    attributes:
      label: Minecraft version and mod loader
      options:
        - Minecraft 1.20.1 - Forge
        - Minecraft 1.20.1 - Fabric
        - Minecraft 1.21.1 - NeoForge
    validations:
      required: true

  - type: input
    id: modpack-name
    attributes:
      label: Modpack name
      description: Add the CurseForge or Modrinth pack name. Leave this blank for a custom pack.
      placeholder: "Example: All the Mods 10"
    validations:
      required: false

  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Tell me what happened and what you expected to happen instead.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: How can we reproduce it?
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true

  - type: upload
    id: world-file
    attributes:
      label: Zipped world file
      description: If you can share the affected world, drag in a zipped copy.
    validations:
      required: false
      accept: ".zip"

  - type: textarea
    id: logs
    attributes:
      label: Logs or crash report
      description: Drag in the relevant log or crash report, or paste a link.
