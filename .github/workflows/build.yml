name: Build

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  build:
    name: Build all mod JARs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: Build all version JARs
        run: bash ./scripts/build-all-versions.sh
      - name: List built JARs
        run: ls -l dist/*.jar
      - uses: actions/upload-artifact@v4
        with:
          name: mod-jars
          path: dist/*.jar
          if-no-files-found: error
          retention-days: 7
