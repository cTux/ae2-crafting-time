import groovy.json.JsonSlurper

plugins {
    id 'java'
}

tasks.register('checkGuideResources') {
    group = 'verification'
    description = 'Checks the optional GuideME book resources and target boundaries.'
    dependsOn ':fabric_1_20_1:processResources', ':mc_1_20_1_forge:processResources',
            ':mc_1_21_1_neoforge:processResources', ':mc_26_1_2_neoforge:processResources'

    doLast {
        def require = { boolean condition, String message ->
            if (!condition) {
                throw new GradleException(message)
            }
        }
        def parse = { String path -> new JsonSlurper().parse(file(path)) }
        def guideRoot = 'shared/src/main/resources/assets/ae2craftingtime'
        def guide = parse("$guideRoot/guideme_guides/guide.json")
        require(guide.item_settings.display_name.translate == 'guide.ae2craftingtime.name', 'Wrong guide title key')
        require(guide.item_settings.model == 'minecraft:item/book', 'Guide must use the vanilla book model')

        def english = parse("$guideRoot/lang/en_us.json")
        def ukrainian = parse("$guideRoot/lang/uk_ua.json")
        require(english['guide.ae2craftingtime.name'] == 'AE2 Crafting Time Guide', 'Missing English guide name')
        require(ukrainian['guide.ae2craftingtime.name'] == 'Посібник AE2 Crafting Time', 'Missing Ukrainian guide name')
        require(english['item.ae2craftingtime.guide'] == english['guide.ae2craftingtime.name'], 'Wrong English Fabric guide name')
        require(ukrainian['item.ae2craftingtime.guide'] == ukrainian['guide.ae2craftingtime.name'], 'Wrong Ukrainian Fabric guide name')

        def guideDirectory = file("$guideRoot/guides/ae2craftingtime/guide")
        def featurePages = [
                'time-estimates.md', 'learning-throughput.md', 'confidence.md', 'job-accuracy.md',
                'delay-diagnostics.md', 'sorting-and-colors.md', 'details-and-reset.md',
                'saved-history.md', 'configuration.md', 'crafting-tree.md', 'me-requester.md',
                'addon-support.md', 'guide-book.md'
        ]
        def relativePath = { File base, File child ->
            base.toPath().relativize(child.toPath()).toString().replace('\\', '/')
        }
        def resolveLink = { String page, String target ->
            def parent = java.nio.file.Paths.get(page).parent
            (parent == null ? java.nio.file.Paths.get(target) : parent.resolve(target))
                    .normalize().toString().replace('\\', '/')
        }
        def links = { String text ->
            (text =~ /\]\(([^)#]+)(?:#[^)]+)?\)/).collect { it[1] }
        }
        def frontmatter = { String text, String key ->
            def match = text =~ /(?m)^\s{2}${key}:\s*"?([^"\r\n]+)"?\s*$/
            match.find() ? match.group(1).trim() : null
        }
        def validateFeatureChapter = { Map<String, String> texts, Set<String> binaries ->
            def errors = []
            def check = { boolean condition, String message -> if (!condition) errors << message }
            def expectedTextPages = ['index.md', 'getting-started.md', 'features/index.md', 'statuses/index.md'] +
                    featurePages.collect { "features/$it" }
            expectedTextPages.each { page ->
                check(texts.containsKey(page), "Missing English guide page: $page")
                check(texts.containsKey("_uk_ua/$page"), "Missing Ukrainian guide page: $page")
            }
            if (errors) return errors

            check(frontmatter(texts['getting-started.md'], 'position') == '0', 'Chapter 1 must use root position 0')
            check(frontmatter(texts['features/index.md'], 'parent') == '../index.md', 'Features parent must be the guide root')
            check(frontmatter(texts['features/index.md'], 'position') == '1', 'Features must use root position 1')
            check(frontmatter(texts['features/index.md'], 'icon') == 'minecraft:clock', 'Features must use the clock icon')
            check(frontmatter(texts['statuses/index.md'], 'position') == '2', 'Statuses must use root position 2')

            ['index.md', 'getting-started.md', 'features/index.md', 'statuses/index.md'].each { page ->
                check(links(texts[page]).any { resolveLink(page, it) == (page == 'index.md' ? 'getting-started.md' : 'index.md') },
                        "Missing root navigation link: $page")
            }

            ['features/index.md', '_uk_ua/features/index.md'].each { landing ->
                def prefix = landing.startsWith('_uk_ua/') ? '_uk_ua/features/' : 'features/'
                def children = links(texts[landing]).collect { resolveLink(landing, it) }
                        .findAll { it.startsWith(prefix) && it != "${prefix}index.md" }
                check(children == featurePages.collect { "$prefix$it" }, "Wrong feature landing order: $landing")
            }

            featurePages.eachWithIndex { page, position ->
                def enPath = "features/$page"
                def ukPath = "_uk_ua/features/$page"
                def en = texts[enPath]
                def uk = texts[ukPath]
                check(frontmatter(en, 'parent') == 'index.md', "Wrong feature parent: $enPath")
                check(frontmatter(en, 'position') == position.toString(), "Wrong feature position: $enPath")
                check(frontmatter(uk, 'parent') == 'index.md', "Wrong Ukrainian feature parent: $ukPath")
                check(frontmatter(uk, 'position') == position.toString(), "Wrong Ukrainian feature position: $ukPath")

                def enLinks = links(en)
                def ukLinks = links(uk)
                check(enLinks == ukLinks, "Guide links differ by locale: $page")
                check(enLinks.count { it.endsWith('.md') } >= 3, "Feature needs three guide links: $enPath")
                check(enLinks.any { resolveLink(enPath, it) == 'features/index.md' }, "Feature must return to landing: $enPath")
                if (position > 0) {
                    check(enLinks.any { resolveLink(enPath, it) == "features/${featurePages[position - 1]}" },
                            "Feature must link to previous page: $enPath")
                }
                if (position < featurePages.size() - 1) {
                    check(enLinks.any { resolveLink(enPath, it) == "features/${featurePages[position + 1]}" },
                            "Feature must link to next page: $enPath")
                }

                def enImages = enLinks.findAll { it.endsWith('.png') }
                def ukImages = ukLinks.findAll { it.endsWith('.png') }
                check(enImages.size() >= 1 && enImages == ukImages, "Feature image differs by locale: $page")
                enImages.each { image ->
                    check(binaries.contains(resolveLink(enPath, image)), "Missing English feature image: $image")
                    check(binaries.contains(resolveLink(ukPath, image)), "Missing Ukrainian feature image: $image")
                }
            }

            texts.findAll { path, ignored -> path.endsWith('.md') }.each { page, text ->
                links(text).findAll { it.endsWith('.md') }.each { link ->
                    check(texts.containsKey(resolveLink(page, link)), "Broken guide link from $page: $link")
                }
            }
            errors
        }

        def guideTexts = [:]
        def guideBinaries = [] as Set
        fileTree(guideDirectory).files.each { resource ->
            def path = relativePath(guideDirectory, resource)
            if (path.endsWith('.md')) guideTexts[path] = resource.getText('UTF-8')
            else guideBinaries << path
        }
        def guideErrors = validateFeatureChapter(guideTexts, guideBinaries)
        require(guideErrors.empty, guideErrors.join('\n'))

        def expectRejected = { String name, Closure mutation ->
            def texts = new LinkedHashMap<>(guideTexts)
            def binaries = new LinkedHashSet<>(guideBinaries)
            mutation(texts, binaries)
            require(!validateFeatureChapter(texts, binaries).empty, "Guide validator accepted $name")
        }
        expectRejected('a missing page') { texts, ignored -> texts.remove('features/confidence.md') }
        expectRejected('a missing translation') { texts, ignored -> texts.remove('_uk_ua/features/confidence.md') }
        expectRejected('a missing image') { ignored, binaries -> binaries.remove('features/images/ttc-low-confidence.png') }
        expectRejected('a missing return link') { texts, ignored ->
            texts['features/confidence.md'] = texts['features/confidence.md'].replace('(index.md)', '(missing.md)')
        }
        expectRejected('an incorrect position') { texts, ignored ->
            texts['features/confidence.md'] = texts['features/confidence.md'].replace('position: 2', 'position: 99')
        }

        def targets = [
                'versions/1.21.1-neoforge': ['minecraft:book', 'ae2:certus_quartz_crystal', 'minecraft:clock'],
                'versions/26.1.2-neoforge': ['minecraft:book', 'ae2:certus_quartz_crystal', 'minecraft:clock']
        ]
        targets.each { target, expectedIngredients ->
            def recipe = parse("$target/src/main/resources/data/ae2craftingtime/recipe/guide_book.json")
            def ingredients = recipe.ingredients.collect { it instanceof Map ? it.item : it }
            require(recipe.type == 'minecraft:crafting_shapeless' && ingredients == expectedIngredients, "Wrong guide recipe ingredients: $target")
            require(recipe.result.id == 'guideme:guide' && recipe.result.count == 1, "Wrong guide recipe result: $target")
            require(recipe.result.components['guideme:guide_id'] == 'ae2craftingtime:guide', "Missing guide identity: $target")
            require(recipe['neoforge:conditions'] == [[type: 'neoforge:mod_loaded', modid: 'guideme']], "Guide recipe must be optional: $target")

            def metadata = file("$target/src/main/resources/META-INF/neoforge.mods.toml").getText('UTF-8')
            require((metadata =~ /(?s)modId="guideme"\s+type="OPTIONAL"\s+versionRange="\[[^"]+,\)"\s+ordering="AFTER"\s+side="BOTH"/).find(), "Wrong GuideME metadata: $target")
        }

        def forgeTarget = 'versions/1.20.1-forge'
        def forgeRecipe = parse("$forgeTarget/src/main/resources/data/ae2craftingtime/recipes/guide_book.json")
        require(forgeRecipe.type == 'forge:conditional' && forgeRecipe.recipes.size() == 1, 'Forge guide recipe must be conditional')
        def forgeEntry = forgeRecipe.recipes[0]
        require(forgeEntry.conditions == [[type: 'forge:mod_loaded', modid: 'guideme']], 'Forge guide recipe must require GuideME')
        def forgeInner = forgeEntry.recipe
        require(forgeInner.type == 'minecraft:crafting_shapeless'
                && forgeInner.ingredients*.item == ['minecraft:book', 'ae2:certus_quartz_crystal', 'minecraft:clock'], 'Wrong Forge guide ingredients')
        require(forgeInner.result == [item: 'guideme:guide', count: 1, nbt: '{guideId:"ae2craftingtime:guide"}'], 'Wrong Forge legacy guide identity')
        def forgeMetadata = file("$forgeTarget/src/main/resources/META-INF/mods.toml").getText('UTF-8')
        require((forgeMetadata =~ /(?s)modId = "guideme"\s+mandatory = false\s+versionRange = "\[20\.1\.15,\)"\s+ordering = "AFTER"\s+side = "BOTH"/).find(), 'Wrong Forge GuideME metadata')

        def fabricTarget = 'versions/1.20.1-fabric'
        def fabricRecipe = parse("$fabricTarget/src/main/resources/data/ae2craftingtime/recipes/guide_book.json")
        require(fabricRecipe.type == 'minecraft:crafting_shapeless'
                && fabricRecipe.ingredients*.item == ['minecraft:book', 'ae2:certus_quartz_crystal', 'minecraft:clock'], 'Wrong Fabric guide ingredients')
        require(fabricRecipe.result == [item: 'ae2craftingtime:guide', count: 1], 'Wrong Fabric guide result')
        require(parse("$fabricTarget/src/main/resources/assets/ae2craftingtime/models/item/guide.json").parent == 'minecraft:item/book', 'Fabric guide must use the vanilla book model')
        require(!file("$fabricTarget/src/main/resources/fabric.mod.json").getText('UTF-8').contains('guideme'), 'Fabric must not declare GuideME')

        fileTree(guideDirectory).files.each { source ->
            def page = relativePath(guideDirectory, source)
            def outputs = [
                    forge: file("$forgeTarget/build/resources/main/assets/ae2craftingtime/guides/ae2craftingtime/guide/$page"),
                    fabric: file("$fabricTarget/build/resources/main/assets/ae2craftingtime/ae2guide/$page"),
                    neoforge1211: file("versions/1.21.1-neoforge/build/resources/main/assets/ae2craftingtime/guides/ae2craftingtime/guide/$page"),
                    neoforge2612: file("versions/26.1.2-neoforge/build/resources/main/assets/ae2craftingtime/guides/ae2craftingtime/guide/$page")
            ]
            outputs.each { target, output ->
                require(output.isFile() && Arrays.equals(source.bytes, output.bytes), "Wrong $target guide output: $page")
            }
        }

        def matrix = parse('scripts/release-matrix.json')
        matrix.each { row ->
            def guideDependencies = row.modrinthDependencies.findAll { it.project_id == 'Ck4E7v7R' }
            def expected = row.id in ['1.20.1-forge', '1.21.1-neoforge', '26.1.2-neoforge']
            require(guideDependencies.size() == (expected ? 1 : 0), "Wrong GuideME release relation: ${row.id}")
            require(!expected || guideDependencies[0].dependency_type == 'optional', "GuideME must be optional: ${row.id}")
        }
    }
}

tasks.named('test') {
    dependsOn tasks.named('checkGuideResources')
}

allprojects {
    group = 'com.ctux.ae2craftingtime'
    version = providers.gradleProperty('modVersion').get()

    repositories {
        mavenCentral()
    }
}

subprojects {
    apply plugin: 'jacoco'

    jacoco {
        toolVersion = '0.8.14'
    }

    plugins.withType(JavaPlugin).configureEach {
        java {
            toolchain.languageVersion = JavaLanguageVersion.of(17)
        }

        tasks.withType(JavaCompile).configureEach {
            options.encoding = 'UTF-8'
        }

        tasks.withType(Jar).configureEach {
            from(rootProject.file('LICENSE')) {
                into 'META-INF'
                rename { 'LICENSE_ae2-crafting-time' }
            }
        }

        dependencies {
            testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.2'
        }

        tasks.named('jacocoTestReport', JacocoReport).configure {
            dependsOn tasks.named('jacocoTestCoverageVerification')
            classDirectories.setFrom(files(classDirectories.files.collect {
                fileTree(dir: it, exclude: 'com/ctux/ae2craftingtime/mc1201/**')
            }))
            reports {
                xml.required = true
            }
        }

        tasks.named('jacocoTestCoverageVerification', JacocoCoverageVerification).configure {
            dependsOn tasks.named('test')
            classDirectories.setFrom(files(classDirectories.files.collect {
                fileTree(dir: it, exclude: 'com/ctux/ae2craftingtime/mc1201/**')
            }))
            if (project.name == 'shared') {
                violationRules.rule {
                    limit {
                        counter = 'LINE'
                        minimum = 1.0
                    }
                    limit {
                        counter = 'BRANCH'
                        minimum = 1.0
                    }
                }
            }
        }
    }
}
