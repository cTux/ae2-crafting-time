pluginManagement {
    repositories {
        gradlePluginPortal()
        maven {
            name = 'MinecraftForge'
            url = 'https://maven.minecraftforge.net/'
        }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.7.0'
}

rootProject.name = 'ae2-craft-performance-debugger'

include ':shared'
include ':mc_1_20_1'
project(':mc_1_20_1').projectDir = file('versions/1.20.1')
