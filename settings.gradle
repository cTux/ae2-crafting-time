pluginManagement {
    repositories {
        gradlePluginPortal()
        maven {
            name = 'NeoForged'
            url = 'https://maven.neoforged.net/releases'
        }
        maven {
            name = 'MinecraftForge'
            url = 'https://maven.minecraftforge.net/'
        }
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
        maven {
            name = 'Modmuss'
            url = 'https://maven.modmuss50.me/'
        }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'ae2-crafting-time'

include ':shared'
include ':fabric_1_20_1'
project(':fabric_1_20_1').projectDir = file('versions/1.20.1-fabric')
include ':mc_1_20_1_forge'
project(':mc_1_20_1_forge').projectDir = file('versions/1.20.1-forge')
include ':mc_1_21_1_neoforge'
project(':mc_1_21_1_neoforge').projectDir = file('versions/1.21.1-neoforge')
