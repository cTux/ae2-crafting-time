plugins {
    id 'net.neoforged.moddev.legacyforge' version '2.0.141'
    id 'com.gradleup.shadow' version '8.3.8'
}

base {
    archivesName = 'ae2-crafting-time-1.20.1-Forge'
}

def runtimeRunDirectory = providers.gradleProperty('runtimeRunDirectory').getOrElse('run')

legacyForge {
    enable {
        forgeVersion = providers.gradleProperty('runtimeForge1201Version').getOrElse('1.20.1-47.1.3')
        disableRecompilation = false
    }
    validateAccessTransformers = true

    runs {
        client {
            client()
            jvmArgument '-Xmx8G'
            ['scenario', 'profile', 'world', 'output', 'interactive'].each { name ->
                def property = providers.gradleProperty("testDriver${name.capitalize()}")
                if (property.isPresent()) {
                    systemProperty "ae2craftingtime.test.${name}", property.get()
                }
            }
            if (providers.gradleProperty('testDriverWorld').isPresent()) {
                programArgument '--quickPlaySingleplayer'
                programArgument providers.gradleProperty('testDriverWorld').get()
            }
        }
        server {
            server()
            programArgument '--nogui'
        }

        configureEach {
            gameDirectory = project.file(runtimeRunDirectory)
            systemProperty 'forge.logging.console.level', 'debug'
        }
    }

    mods {
        ae2craftingtime {
            sourceSet sourceSets.main
        }
    }
}

sourceSets {
    testDriver
}

java.registerFeature('testDriver') {
    usingSourceSet(sourceSets.testDriver)
}

sourceSets.testDriver.compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
sourceSets.testDriver.runtimeClasspath += sourceSets.testDriver.output + sourceSets.testDriver.compileClasspath
sourceSets.test.compileClasspath += sourceSets.testDriver.output
sourceSets.test.runtimeClasspath += sourceSets.testDriver.output

mixin {
    add sourceSets.main, 'ae2craftingtime.refmap.json'
    add sourceSets.testDriver, 'ae2craftingtime_test_driver.refmap.json'
    config 'ae2craftingtime.mixins.json'
    config 'ae2craftingtime-advancedae.mixins.json'
}

sourceSets.main.java.srcDir '../../shared/src/main/java'
sourceSets.main.java.srcDir '../../shared/src/mcCommon/java'
sourceSets.main.java.srcDir '../../shared/src/mc1201/java'
sourceSets.main.java.srcDir '../../shared/src/neoforge/java/com/ctux/ae2craftingtime/mc1201/mixin'
sourceSets.main.resources.srcDir '../../shared/src/main/resources'
sourceSets.main.resources.srcDir '../../shared/src/mc1201/resources'
sourceSets.test.java.srcDir '../../shared/src/mc1201Test/java'

sourceSets.test.compileClasspath += sourceSets.main.compileClasspath
sourceSets.test.runtimeClasspath += sourceSets.main.runtimeClasspath

repositories {
    mavenCentral()
    maven { url = 'https://api.modrinth.com/maven' }
    ivy {
        url = uri("$runtimeRunDirectory/resolved-mods")
        patternLayout { artifact '[artifact].[ext]' }
        metadataSources { artifact() }
    }
    maven {
        url = 'https://cursemaven.com'
        content { includeGroup 'curse.maven' }
    }
    maven {
        name = 'Modmaven'
        url = 'https://modmaven.dev/'
        content { includeGroup 'appeng' }
    }
}

dependencies {
    modImplementation "appeng:appliedenergistics2-forge:${providers.gradleProperty('runtimeAe2Forge1201Version').getOrElse('15.0.10')}"
    compileOnly 'maven.modrinth:advancedae:1.3.6-1.20.1'
    testDriverCompileOnly 'maven.modrinth:extended-ae:1.20-1.4.18-forge'
    testDriverCompileOnly 'maven.modrinth:extendedae-plus:1.5.5'
    testDriverCompileOnly 'maven.modrinth:bmaddon:1.0.4'
    testDriverCompileOnly 'curse.maven:blood-magic-224791:7956981'
    testDriverCompileOnly 'maven.modrinth:anaGQD2Q:KwFCuLdA'
    testDriverCompileOnly 'maven.modrinth:4inoel9g:RFT2nmVb'
    testDriverCompileOnly 'maven.modrinth:pNabrMMw:z8QXeyI0'
    testDriverCompileOnly 'maven.modrinth:neoecoae:20.3.0'
    testDriverCompileOnly 'maven.modrinth:jjuIRIVr:SH2D1n3s'
    testDriverCompileOnly 'maven.modrinth:RYE1pYyr:c2s3iMw8'
    testDriverCompileOnly 'maven.modrinth:IZPmgTLT:wCGFfeun'
    testDriverCompileOnly 'maven.modrinth:oMgZ004U:cAcdjzEn'
    testDriverCompileOnly 'curse.maven:omnisequence-transfinite-1624558:8675216'
    testDriverCompileOnly 'curse.maven:appliede-tps-fix-1571176:8432892'
    testDriverCompileOnly 'curse.maven:projecte-226410:4901949'
    fileTree("$runtimeRunDirectory/resolved-mods") { include '*.jar' }.each {
        add('modImplementation', "runmods:${it.name - '.jar'}:1")
    }

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'

    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
    testDriverAnnotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}

configurations {
    testDriverLibraries
    testDriverImplementation.extendsFrom testDriverLibraries
}

dependencies {
    testDriverLibraries 'io.modelcontextprotocol.sdk:mcp:2.0.1'
    testDriverLibraries 'org.apache.tomcat.embed:tomcat-embed-core:11.0.10'
}

test {
    useJUnitPlatform()
}

tasks.named('processResources', ProcessResources).configure {
    def props = [
            mod_id                 : 'ae2craftingtime',
            mod_name               : 'AE2 Crafting Time',
            mod_version            : project.version,
            mod_license            : 'MIT',
            mod_authors            : 'ctux',
            mod_description        : 'Shows when AE2 autocrafting should finish and helps you spot delays and bottlenecks.',
            minecraft_version_range: '[1.20.1,1.21)',
            forge_version_range    : '[47.1.3,)',
            loader_version_range   : '[47,)'
    ]

    inputs.properties props

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand props
    }
}

tasks.named('processTestDriverResources', ProcessResources).configure {
    def props = [
            mod_version            : project.version,
            minecraft_version_range: '[1.20.1,1.21)',
            forge_version_range    : '[47.1.3,)',
            loader_version_range   : '[47,)'
    ]
    inputs.properties props
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand props
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : 'ae2craftingtime',
                'Specification-Vendor'    : 'ctux',
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.version,
                'Implementation-Vendor'   : 'ctux',
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                'MixinConfigs'            : 'ae2craftingtime.mixins.json,ae2craftingtime-advancedae.mixins.json'
        ])
    }
}

def distModVersion = project.version.toString()

tasks.register('distMod', Copy) {
    dependsOn tasks.named('reobfJar')
    from tasks.named('reobfJar')
    into rootProject.layout.projectDirectory.dir('dist')
    rename { "ae2-crafting-time-${distModVersion}-forge-1.20.1.jar" }
}

def testDriverFileName = "ae2-crafting-time-${project.version}-forge-1.20.1-test-driver.jar"
def testDriverUnmappedJar = tasks.register('testDriverUnmappedJar', com.github.jengelman.gradle.plugins.shadow.tasks.ShadowJar) {
    dependsOn tasks.named('compileTestDriverJava')
    from sourceSets.testDriver.output
    from layout.buildDirectory.file('mixin/ae2craftingtime_test_driver.refmap.json')
    configurations = [project.configurations.testDriverLibraries]
    archiveFileName = testDriverFileName
    destinationDirectory = layout.buildDirectory.dir('test-driver-unmapped')
    mergeServiceFiles()
    manifest {
        attributes 'MixinConfigs': 'ae2craftingtime_test_driver.mixins.json'
    }
    exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA', 'META-INF/versions/**',
            'module-info.class', 'org/slf4j/**'
    relocate 'io.modelcontextprotocol', 'com.ctux.ae2craftingtime.testdriver.lib.mcp'
    relocate 'reactor', 'com.ctux.ae2craftingtime.testdriver.lib.reactor'
    relocate 'com.fasterxml.jackson', 'com.ctux.ae2craftingtime.testdriver.lib.jackson'
    relocate 'tools.jackson', 'com.ctux.ae2craftingtime.testdriver.lib.jackson3'
    relocate 'com.networknt', 'com.ctux.ae2craftingtime.testdriver.lib.jsonschema'
    relocate 'com.ethlo', 'com.ctux.ae2craftingtime.testdriver.lib.ethlo'
    relocate 'org.snakeyaml', 'com.ctux.ae2craftingtime.testdriver.lib.snakeyaml'
    relocate 'org.reactivestreams', 'com.ctux.ae2craftingtime.testdriver.lib.reactivestreams'
    relocate 'org.apache.catalina', 'com.ctux.ae2craftingtime.testdriver.lib.tomcat'
    relocate 'org.apache.coyote', 'com.ctux.ae2craftingtime.testdriver.lib.tomcat_coyote'
    relocate 'org.apache.tomcat', 'com.ctux.ae2craftingtime.testdriver.lib.tomcat_api'
    relocate 'org.apache.juli', 'com.ctux.ae2craftingtime.testdriver.lib.tomcat_logging'
    relocate 'jakarta.servlet', 'com.ctux.ae2craftingtime.testdriver.lib.servlet'
    relocate 'jakarta.security', 'com.ctux.ae2craftingtime.testdriver.lib.security'
    relocate 'jakarta.annotation', 'com.ctux.ae2craftingtime.testdriver.lib.annotation'
}

def reobfTestDriverJar = obfuscation.reobfuscate(testDriverUnmappedJar, sourceSets.testDriver) {
    archiveFileName = testDriverFileName
    destinationDirectory = rootProject.layout.buildDirectory.dir('test-driver')
}

tasks.named('reobfJar') {
    dependsOn tasks.named('compileTestDriverJava')
}

tasks.named('testDriverJar') {
    group = 'build'
    description = 'Builds the isolated Forge 1.20.1 UI test-driver mod.'
    dependsOn reobfTestDriverJar
}

tasks.register('checkTestDriverArtifacts') {
    group = 'verification'
    dependsOn tasks.named('reobfJar'), reobfTestDriverJar
    doLast {
        def production = tasks.named('reobfJar').get().archiveFile.get().asFile
        def driver = reobfTestDriverJar.get().archiveFile.get().asFile
        def productionEntries = zipTree(production).files.collect { it.path.replace('\\', '/') }
        def driverEntries = zipTree(driver).files.collect { it.path.replace('\\', '/') }
        def forbiddenProduction = ['testdriver/', 'ae2craftingtime_test_driver', 'modelcontextprotocol']
        if (productionEntries.any { entry -> forbiddenProduction.any { entry.contains(it) } }) {
            throw new GradleException("Production JAR contains test-driver content: ${production}")
        }
        if (driverEntries.any { it.contains('/mc1201/Ae2CraftingTime.class') }) {
            throw new GradleException("Test-driver JAR embeds production classes: ${driver}")
        }
        if (!driverEntries.any { it.endsWith('/testdriver/TestDriverMod.class') }
                || !driverEntries.any { it.endsWith('META-INF/mods.toml') }) {
            throw new GradleException("Test-driver JAR is incomplete: ${driver}")
        }
    }
}

tasks.named('test') {
    dependsOn tasks.named('checkTestDriverArtifacts')
}
