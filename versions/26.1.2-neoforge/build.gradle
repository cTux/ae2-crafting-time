plugins {
    id 'net.neoforged.moddev' version '2.0.141'
}

base {
    archivesName = 'ae2-crafting-time-26.1.2-NeoForge'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
}

neoForge {
    version = '26.1.2.71'

    runs {
        client {
            client()
        }
        server {
            server()
            programArgument '--nogui'
        }

        configureEach {
            gameDirectory = project.file('run')
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        ae2craftingtime {
            sourceSet sourceSets.main
        }
    }
}

sourceSets.main.java.srcDir '../../shared/src/main/java'
sourceSets.main.java.srcDir '../../shared/src/mcCommon/java'
sourceSets.main.java.srcDir '../../shared/src/neoforge/java'
sourceSets.main.java.srcDir '../../shared/src/mc2612/java'
sourceSets.main.resources.srcDir '../../shared/src/main/resources'

sourceSets.test.java.srcDir '../../shared/src/mc1201Test/java'
sourceSets.test.compileClasspath += sourceSets.main.compileClasspath
sourceSets.test.runtimeClasspath += sourceSets.main.runtimeClasspath

repositories {
    mavenCentral()
    maven { url = 'https://api.modrinth.com/maven' }
}

dependencies {
    implementation 'org.appliedenergistics:appliedenergistics2:26.1.10-beta'
    compileOnly 'maven.modrinth:advancedae:26.1.7'

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'

    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}

test {
    useJUnitPlatform()
}

tasks.named('processResources', ProcessResources).configure {
    def props = [
            mod_id                 : 'ae2craftingtime',
            mod_name               : 'AE2 Crafting Time',
            mod_version            : project.version,
            mod_license            : 'MIT',
            mod_authors            : 'ctux',
            mod_description        : 'Shows when AE2 autocrafting should finish and helps you spot delays and bottlenecks.',
            minecraft_version_range: '[26.1.2]',
            neoforge_version_range : '[26.1.2.71,)',
            loader_version_range   : '[1,)'
    ]

    inputs.properties props

    filesMatching(['META-INF/neoforge.mods.toml', 'pack.mcmeta']) {
        expand props
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : 'ae2craftingtime',
                'Specification-Vendor'    : 'ctux',
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.version,
                'Implementation-Vendor'   : 'ctux',
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

def distModVersion = project.version.toString()

tasks.register('distMod', Copy) {
    dependsOn tasks.named('jar')
    from tasks.named('jar').flatMap { it.archiveFile }
    into rootProject.layout.projectDirectory.dir('dist')
    rename { "ae2-crafting-time-${distModVersion}-neoforge-26.1.2.jar" }
}
